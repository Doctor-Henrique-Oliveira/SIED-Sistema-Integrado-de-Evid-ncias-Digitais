[workspace]
resolver = "2"
members = [
    "crates/sied-dominio",
    "crates/sied-armazenamento",
    "crates/sied-ingestao",
    "crates/sied-documentos",
    "crates/sied-midia",
    "crates/sied-relatorio",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
# functions: sied_normal (minúsculas e sem acento, em Rust) nas consultas de filtro.
# hooks: interrupção cooperativa restrita à descoberta local MDFML.
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: números reais relidos do banco do caso voltam idênticos, bit a bit,
# para que o hash_registro possa ser recalculado (ver NovoArtefato::hash_registro).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
tracing = "0.1"
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"
walkdir = "2"
flate2 = "1"

sied-dominio = { path = "crates/sied-dominio" }
sied-armazenamento = { path = "crates/sied-armazenamento" }
sied-ingestao = { path = "crates/sied-ingestao" }
sied-documentos = { path = "crates/sied-documentos" }
sied-midia = { path = "crates/sied-midia" }
sied-relatorio = { path = "crates/sied-relatorio" }

# Dependências (Typst, Tauri, image...) sem informação de depuração nos builds de
# desenvolvimento e de teste: cada binário de teste que liga o Typst passava de 500 MB
# e o disco do executor Linux da CI acabava no meio da ligação (rust-lld com "Bus
# error"). O código do workspace continua com depuração completa.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
