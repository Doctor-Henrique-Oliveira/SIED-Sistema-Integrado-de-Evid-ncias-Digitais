[workspace]
resolver = "2"
members = [
    "crates/sied-dominio",
    "crates/sied-armazenamento",
    "crates/sied-ingestao",
    "crates/sied-midia",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"
walkdir = "2"

sied-dominio = { path = "crates/sied-dominio" }
sied-armazenamento = { path = "crates/sied-armazenamento" }
sied-ingestao = { path = "crates/sied-ingestao" }
sied-midia = { path = "crates/sied-midia" }

[profile.release]
lto = true
codegen-units = 1
