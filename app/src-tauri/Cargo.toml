[package]
name = "sied-desktop"
description = "SIED — Sistema Integrado de Evidências Digitais (aplicativo desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sied_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sied-armazenamento.workspace = true
sied-dominio.workspace = true
sied-documentos.workspace = true
sied-ingestao.workspace = true
sied-midia.workspace = true
sied-relatorio.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
