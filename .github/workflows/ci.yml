name: CI

# Mudanças só de documentação não rodam a CI. (Em tags, o GitHub não avalia filtros de
# caminho: toda tag de release roda tudo.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read

# PR: um push novo cancela a execução anterior do mesmo PR, que ficou obsoleta.
# main: o grupo é o próprio commit, então cada commit mesclado mantém a sua execução
# completa e só execuções repetidas do mesmo commit são descartadas.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  rust-e-interface:
    name: Testes (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # O cache só é gravado na main; PRs reaproveitam o da main sem disputar espaço.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build da interface (necessário para compilar o app Tauri)
        run: npm run build
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Tipos TypeScript gerados estão atualizados
        run: git diff --exit-code -- app/src/api/tipos
      - run: npm test
        working-directory: app

  windows:
    name: Testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: cargo test --workspace

  # Instaladores só quando fazem diferença: tag de release, execução manual ou PR que
  # mexe no que define o build do app.
  decidir-instaladores:
    name: Instaladores são necessários?
    runs-on: ubuntu-24.04
    outputs:
      gerar: ${{ steps.decisao.outputs.gerar }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decisao
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gerar=false
          if [[ "$EVENTO" == workflow_dispatch || "$REF" == refs/tags/v* ]]; then
            gerar=true
          elif [[ "$EVENTO" == pull_request ]]; then
            mudados=$(git diff --name-only "$BASE...$HEAD")
            echo "$mudados"
            if grep -qE '^(app/src-tauri/|app/package(-lock)?\.json$|app/vite\.config\.|app/index\.html$|app/recursos/|app/public/|\.cargo/|\.github/workflows/)|(^|/)Cargo\.(toml|lock)$' <<<"$mudados"; then
              gerar=true
            fi
          fi
          echo "gerar=$gerar" | tee -a "$GITHUB_OUTPUT"

  instaladores-windows:
    name: Instaladores Windows (NSIS e MSI)
    needs: decidir-instaladores
    if: needs.decidir-instaladores.outputs.gerar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache próprio do perfil release (roda pouco, então sempre grava).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: instaladores-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Instalador (NSIS e MSI)
        run: npx tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: sied-windows-instaladores
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 7
