name: CI

# Mudanças só de documentação não rodam a CI. (Em tags, o GitHub não avalia filtros de
# caminho: toda tag de release roda tudo.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read

# PR: um push novo cancela a execução anterior do mesmo PR, que ficou obsoleta.
# main: o grupo é o próprio commit, então cada commit mesclado mantém a sua execução
# completa e só execuções repetidas do mesmo commit são descartadas.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  contratos-documentais:
    name: Contratos documentais (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Exportação genuína por ts-rs, recuperável pelo log sem depender da quota
      # de artifacts. Os gates completos de testes/tipos abaixo são preservados.
      - name: Gerar contratos de índice e revisão pelo Rust
        run: cargo test --locked -p sied-armazenamento --lib imprime_contratos -- --nocapture --test-threads=1
      - name: Gerar contratos pelo Rust e testar leitores documentais
        run: cargo test --locked -p sied-documentos -- --nocapture --test-threads=1

  rust-e-interface:
    name: Testes (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # O cache só é gravado na main; PRs reaproveitam o da main sem disputar espaço.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Valida a biblioteca AI-1 sem depender do frontend, Tauri ou Typst.
      # Todos os gates completos abaixo continuam obrigatórios.
      - name: Testes da fundação documental AI-1
        run: cargo test --locked -p sied-documentos
      - name: Clippy da fundação documental AI-1
        run: cargo clippy --locked -p sied-documentos --all-targets -- -D warnings
      - name: Medir leitura documental sintética AI-1
        run: cargo test --locked --release -p sied-documentos --test documentos medicao_20_leituras_reais_de_texto_sintetico_de_2mib -- --ignored --exact --nocapture
      - name: Medir leitura PDF nativa sintética AI-1
        run: cargo test --locked --release -p sied-documentos --test pdf medicao_20_leituras_reais_de_pdf_sintetico -- --ignored --exact --nocapture
      - name: Build da interface (necessário para compilar o app Tauri)
        run: npm run build
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --nocapture --test-threads=1
      - name: Tipos TypeScript gerados estão atualizados
        run: git diff --exit-code -- app/src/api/tipos
      - run: npm test
        working-directory: app

  windows:
    name: Testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: cargo test --workspace -- --nocapture --test-threads=1

  # O NSIS é validado quando faz diferença. Em main/execução manual, ele também é
  # publicado como pré-release, sem consumir a quota de artifacts do Actions.
  decidir-instaladores:
    name: Instaladores são necessários?
    runs-on: ubuntu-24.04
    outputs:
      gerar: ${{ steps.decisao.outputs.gerar }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decisao
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gerar=false
          if [[ "$EVENTO" == workflow_dispatch || "$REF" == refs/heads/main || "$REF" == refs/tags/v* ]]; then
            gerar=true
          elif [[ "$EVENTO" == pull_request ]]; then
            mudados=$(git diff --name-only "$BASE...$HEAD")
            echo "$mudados"
            if grep -qE '^(app/src-tauri/|app/package(-lock)?\.json$|app/vite\.config\.|app/index\.html$|app/recursos/|app/public/|\.cargo/|\.github/workflows/)|(^|/)Cargo\.(toml|lock)$' <<<"$mudados"; then
              gerar=true
            fi
          fi
          echo "gerar=$gerar" | tee -a "$GITHUB_OUTPUT"

  instaladores-windows:
    name: Instalador Windows (NSIS)
    needs: decidir-instaladores
    if: needs.decidir-instaladores.outputs.gerar == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache próprio do perfil release (roda pouco, então sempre grava).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: instaladores-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Instalador NSIS
        run: npx tauri build --bundles nsis
        working-directory: app
      - name: Publicar pré-release de validação
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "sied-preview-main"
          $instalador = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $instalador) {
            throw "O instalador NSIS não foi encontrado."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release create $tag $instalador.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "SIED — prévia atual da main" `
            --notes "Instalador NSIS para validação manual do commit $env:GITHUB_SHA. Esta é uma versão de prévia."
