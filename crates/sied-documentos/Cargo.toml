[package]
name = "sied-documentos"
description = "Leitura local de UTF-8 e PDF nativo por página, com origem conferida e limites cooperativos."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
hex.workspace = true
flate2.workspace = true
lopdf = { version = "=0.45.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
sha2.workspace = true
sied-dominio.workspace = true
sied-ingestao.workspace = true
ts-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Data_Pdf",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
png = "=0.18.1"
rusqlite.workspace = true
serde_json.workspace = true
sied-armazenamento.workspace = true
tempfile.workspace = true
walkdir.workspace = true
